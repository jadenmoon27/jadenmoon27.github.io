    Experience:
      - company: HealthX Lab, Dartmouth College
        position: James O. Freedman Presidential Scholar
        location: Hanover, New Hampshire
        start_date: 2025-09
        end_date: Present
        summary: "Advisor: Prof. Andrew T. Campbell"
        highlights:
          - >-
            **ReliaGate (accepted at WellComp 2026):** Developed a post-hoc reliability router combining
            confidence, signal quality and modality trust, cross-modal agreement,
            train-standardized atypicality, and train-fitted embedding geometry
            to surface or withhold unchanged wearable-stress predictions.
          - >-
            Evaluated ReliaGate across WESAD, UBFC-Phys, EmpaticaE4Stress, and
            PhysioNetE4 using subject-disjoint folds, fold-local selection, and
            paired held-out-subject intervals; on UBFC-Phys, relative to the
            learned no-geometry routing system, increased coverage by 10.1
            percentage points and reduced accepted risk by 5.6 percentage points.
            WESAD analyses showed favorable pooled outcomes could coexist with
            higher median per-subject accepted risk.
          - >-
            **ReliaGate++ (ongoing follow-on work):** Extending static routing into
            validation-locked temporal emission control and auditing cue
            precision, false stress and reassurance, contradiction and flip
            rates, subject reach, and episode coverage.
          - >-
            **INTERSPEECH 2026:** Developed a leakage-safe intervention
            diagnostic that freezes trained experts and fusion parameters while
            shuffling quality scores across held-out examples to test
            decision-level reliance. Across StressID and CMU-MOSEI, 25 runs per
            dataset showed near-zero native performance changes, while positive
            controls confirmed sensitivity when reliability tracked correctness.

      - company: Mayo Clinic Comprehensive Cancer Center
        position: Summer Undergraduate Research Fellow
        location: Phoenix, Arizona
        start_date: 2026-06
        end_date: Present
        summary: "Advisor: Wei Liu, Ph.D."
        highlights:
          - >-
            Developed a validation-locked selective-review model for quality
            assurance of AI-generated head-and-neck organ contours using CT,
            geometric, segmentation uncertainty, and native-plan dose-context
            evidence; classified 59.4% of 3,812 held-out contour instances as low
            risk at 99.91% NPV, 97.47% sensitivity, and 0.936 AUROC.
          - >-
            Built a patient-disjoint training and evaluation pipeline spanning
            752 cases, 37,228 contour instances, and 5 folds with nnU-Net and
            SLURM; added automated checks for split leakage, provenance, and
            reproducibility.

      - company: AIM HIGH Lab, Dartmouth College
        position: Waterhouse Research Award Scholar
        location: Hanover, New Hampshire
        start_date: 2025-02
        end_date: 2025-08
        summary: "Advisor: Prof. Nicholas C. Jacobson"
        highlights:
          - >-
            Fine-tuned LLaMA-3.1-8B-Instruct with LoRA/QLoRA for
            therapeutic-dialogue generation and implemented reproducible
            training and inference workflows under constrained compute.
          - >-
            Evaluated 1,753 generated responses using semantic metrics and
            structured failure analysis to identify contextual grounding and
            off-target generation errors.


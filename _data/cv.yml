    Research Experience:
      - company: Mayo Clinic Comprehensive Cancer Center
        position: Summer Undergraduate Research Fellow
        location: Phoenix, Arizona
        start_date: 2026-06
        end_date: 2026-08
        summary: "Advised by Prof. Wei Liu."
        highlights:
          - Developed AI methods for automatic quality assurance of radiotherapy autosegmentation.
          - Built patient-level data auditing and evaluation pipelines for 3D imaging, predicted masks, and structured quality signals.
          - Studied high-sensitivity selective prediction and foundation-model-based verification under clinically asymmetric risk.
          - Public descriptions omit internal data, exact unpublished results, and protected clinical details.

      - company: HealthX Lab, Dartmouth College
        position: James O. Freedman Presidential Scholar
        location: Hanover, New Hampshire
        start_date: 2025-09
        end_date: present
        summary: "Advised by Prof. Andrew T. Campbell."
        highlights:
          - Led a first-author INTERSPEECH 2026 paper on leakage-safe diagnosis of decision-level reliance on modality-quality signals.
          - Developed a post-hoc identifiability test that freezes unimodal experts and fusion parameters while breaking quality-instance alignment at inference time.
          - Built controlled multimodal evaluation pipelines on StressID and CMU-MOSEI using five seeds, five folds, and subject- or video-disjoint splits.
          - Showed that native quality signals can exhibit near-zero clean-versus-broken gaps despite oracle routing headroom, while positive controls validate the diagnostic when reliability tracks expert correctness.

      - company: AIM HIGH Lab, Dartmouth College
        position: Waterhouse Research Award Scholar
        location: Hanover, New Hampshire
        start_date: 2025-02
        end_date: 2025-08
        summary: "Advised by Prof. Nicholas C. Jacobson."
        highlights:
          - Fine-tuned LLaMA-3.1-8B-Instruct with LoRA and QLoRA for therapeutic-dialogue generation under constrained compute.
          - Built an evaluation pipeline for 1,753 generated responses using semantic metrics and structured error analysis.
          - Reduced training cost by 35 percent through 4-bit quantization, enabling broader experimental sweeps.
          - Designed prompting and inference workflows to improve contextual grounding and reduce off-target generations.

